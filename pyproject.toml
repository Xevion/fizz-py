[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "pybind11-stubgen"]
build-backend = "scikit_build_core.build"

[project]
name = "fizzpy"
version = "0.3.0"
description = "A low-level TLS 1.3 client toolkit for Python, built on Facebook's Fizz"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xevion", email = "xevion@xevion.dev" }]
dependencies = ["certifi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Xevion/fizz-py"
Issues = "https://github.com/Xevion/fizz-py/issues"

# `dev` typechecks against the committed _core.pyi, so CI never builds the
# native extension to lint: `uv sync --no-install-project --group dev`.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "basedpyright>=1.39"]
build = ["scikit-build-core", "pybind11>=2.13", "pybind11-stubgen"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.ruff]
target-version = "py310"
# Build/dev artifacts carry their own (or no) style.
extend-exclude = [".dev", "build", "dist"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "TID",  # flake8-tidy-imports
    "ISC",  # flake8-implicit-str-concat
    "FBT",  # flake8-boolean-trap
    "PGH",  # pygrep-hooks (blanket noqa / type:ignore)
    "PERF", # perflint
    "FURB", # refurb
    "FLY",  # flynt
    "RUF",  # ruff-specific
]
# Public exception names mirror requests/httpx (e.g. TooManyRedirects), which
# deliberately omit the Error suffix N818 wants.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# The stub mirrors the pybind11 method names (camelCase) verbatim.
"*.pyi" = ["N802", "N803", "N815"]
# Tests use stdlib handler overrides (do_GET), broad raises, and fixture
# patterns the strict library rules would otherwise flag.
"tests/**" = ["FBT", "PT011", "B017", "N802", "N815"]
# Dev scripts dispatch CLI flags as positional bools.
"scripts/**" = ["FBT"]

[tool.basedpyright]
# Strict correctness checking, minus the Any-purity rules: the native _core
# boundary and the resolve/reject bridge legitimately traffic in Any.
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["fizzpy"]
exclude = ["pybind11", ".dev", "build", "dist", "**/__pycache__"]
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["fizzpy"]

# Local development builds against a system/Homebrew (or getdeps) Fizz and pass
# -DCMAKE_PREFIX_PATH directly to cmake. See BUILDING.md.

# Portable wheels link _core against the folly+fizz+liboqs tree baked into the
# prebuilt manylinux image (.github/manylinux-deps.Dockerfile). CMake reads the
# install prefix from $FIZZPY_BUILD_INFO at configure time. The Python version
# matrix fans out one image-cached build per interpreter in CI (wheels.yml).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
# --no-build-isolation skips auto-installing the build backend, so install it here.
# Identical on every platform, so it lives at the top level.
before-build = "pip install scikit-build-core pybind11 pybind11-stubgen"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# The deps image carries the prebuilt folly+fizz+liboqs tree, so there is no
# before-all — each build just compiles _core against the baked prefix CMake
# reads from $FIZZPY_BUILD_INFO. CI sets the image ref (content-addressed, owner
# resolved at runtime) via CIBW_MANYLINUX_X86_64_IMAGE in wheels.yml.
# The getdeps tree builds glog/gflags (and on Windows openssl/libsodium) as shared
# libs in install dirs outside the loader's default search path, so _core has a
# runtime dependency the default repair command can't resolve. Each platform below
# points its repair tool at those dirs. auditwheel searches only LD_LIBRARY_PATH;
# the glob+pipe is fine here (repair runs in the real shell, unlike the
# `environment` table's restricted evaluator).
repair-wheel-command = "LD_LIBRARY_PATH=\"$(echo /opt/fizz-deps/installed/*/lib /opt/fizz-deps/installed/*/lib64 | tr ' ' ':'):$LD_LIBRARY_PATH\" auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.linux.environment]
FIZZPY_BUILD_INFO = "/opt/fizzpy-build"

# macOS/Windows have no prebuilt deps image, so before-all builds the folly+fizz+
# liboqs tree on the runner. wheels.yml supplies FIZZ_SRC/GETDEPS_SCRATCH/
# FIZZPY_BUILD_INFO per-runner and caches the scratch dir.
[tool.cibuildwheel.macos]
before-all = "python3 scripts/build_fizz_deps_native.py"
# delocate reads only DYLD_*. Set it inline: macOS SIP strips DYLD_* from the
# system shell's env, but not vars that shell sets for its own children.
repair-wheel-command = "DYLD_LIBRARY_PATH=\"$(echo $GETDEPS_SCRATCH/installed/*/lib | tr ' ' ':')\" delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
# 64-bit only: the getdeps tree is built x86_64, so the default win32 (32-bit)
# build can't link it. delvewheel vendors the runtime DLLs into the wheel.
archs = ["AMD64"]
before-all = "python scripts/build_fizz_deps_native.py"
# delvewheel searches only PATH; --add-path feeds it the getdeps dirs. Their names
# are content-addressed (hashed), so a shim globs them rather than a fixed path.
repair-wheel-command = "python scripts/repair_wheel_windows.py {dest_dir} {wheel}"
