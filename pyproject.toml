[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11", "pybind11-stubgen"]
build-backend = "scikit_build_core.build"

[project]
name = "fizzpy"
version = "0.1.0"
description = "A low-level TLS 1.3 client toolkit for Python, built on Facebook's Fizz"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ryan Walters", email = "ryan@walters.to" }]
dependencies = ["certifi"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["fizzpy"]

# vcpkg-based wheel builds set CMAKE_TOOLCHAIN_FILE via the VCPKG_ROOT env var
# (see CMakeLists.txt). Local development builds against system/Homebrew Fizz
# and pass -DCMAKE_PREFIX_PATH directly to cmake instead.
