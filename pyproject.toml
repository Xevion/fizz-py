[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11>=2.13", "pybind11-stubgen"]
build-backend = "scikit_build_core.build"

[project]
name = "fizzpy"
version = "0.1.0"
description = "A low-level TLS 1.3 client toolkit for Python, built on Facebook's Fizz"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ryan Walters", email = "ryan@walters.to" }]
dependencies = ["certifi"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff", "basedpyright", "scikit-build-core", "pybind11", "pybind11-stubgen"]

[tool.ruff]
target-version = "py310"
# Build/dev artifacts carry their own (or no) style.
extend-exclude = [".dev", "build", "dist"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "TID",  # flake8-tidy-imports
    "ISC",  # flake8-implicit-str-concat
    "FBT",  # flake8-boolean-trap
    "PGH",  # pygrep-hooks (blanket noqa / type:ignore)
    "PERF", # perflint
    "FURB", # refurb
    "FLY",  # flynt
    "RUF",  # ruff-specific
]
# Public exception names mirror requests/httpx (e.g. TooManyRedirects), which
# deliberately omit the Error suffix N818 wants.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# The stub mirrors the pybind11 method names (camelCase) verbatim.
"*.pyi" = ["N802", "N803", "N815"]
# Tests use stdlib handler overrides (do_GET), broad raises, and fixture
# patterns the strict library rules would otherwise flag.
"tests/**" = ["FBT", "PT011", "B017", "N802", "N815"]
# Dev scripts dispatch CLI flags as positional bools.
"scripts/**" = ["FBT"]

[tool.basedpyright]
# Strict correctness checking, minus the Any-purity rules: the native _core
# boundary and the resolve/reject bridge legitimately traffic in Any.
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["fizzpy"]
exclude = ["pybind11", ".dev", "build", "dist", "**/__pycache__"]
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["fizzpy"]

# Local development builds against a system/Homebrew (or getdeps) Fizz and pass
# -DCMAKE_PREFIX_PATH directly to cmake. See BUILDING.md.

# Portable wheels: build the folly+fizz+liboqs tree once per manylinux container
# (scripts/build_fizz_deps.py), then compile and link _core against it per Python
# version. Build deps are installed by before-build so --no-build-isolation can
# see them. CMAKE_PREFIX_PATH points at the getdeps install dirs plus this
# interpreter's pybind11; CMAKE_ARGS supplies fizz's bundled find-modules.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "python {project}/scripts/build_fizz_deps.py"
before-build = "pip install scikit-build-core pybind11 pybind11-stubgen"

[tool.cibuildwheel.linux.environment]
GETDEPS_SCRATCH = "/opt/fizz-deps"
FIZZPY_BUILD_INFO = "/opt/fizzpy-build"
CMAKE_PREFIX_PATH = "$(cat /opt/fizzpy-build/prefix.txt);$(pybind11-config --cmakedir)"
CMAKE_ARGS = "-DFIZZ_CMAKE_MODULE_DIR=$(cat /opt/fizzpy-build/module_dir.txt)"
