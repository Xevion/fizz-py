name: Manylinux deps image

# The folly+fizz+liboqs tree only changes when the build script or the pinned
# Fizz tag changes, so the image rebuilds on those paths (or on demand) rather
# than per wheel run.
on:
  push:
    branches: [master]
    paths:
      - scripts/build_fizz_deps.py
      - .github/manylinux-deps.Dockerfile
      - .github/workflows/manylinux-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # GHCR repository names must be lowercase; keep in sync with the
  # manylinux-x86_64-image pin in pyproject.toml.
  IMAGE: ghcr.io/xevion/fizz-py-deps

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/manylinux-deps.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
