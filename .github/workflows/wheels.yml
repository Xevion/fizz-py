name: Wheels

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build manylinux wheels (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Builds folly + fizz + liboqs from source inside the manylinux container
      # (see scripts/build_fizz_deps.py), so the dep tree is heavy: expect ~40 min on
      # a cold cache. liboqs travels with fizz's getdeps manifest, giving the
      # shipped wheel real post-quantum (X25519MLKEM768) support.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error
