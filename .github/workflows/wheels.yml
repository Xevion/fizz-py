name: Wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The folly+fizz+liboqs tree is baked into a GHCR image tagged by the hash of
  # its build inputs. This job rebuilds it only when that hash has no image yet
  # (deps changed, or first run); otherwise it's a fast existence check. Wheels
  # depend on it, so they never run against a missing image.
  deps_image:
    name: Deps image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image ref
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/${OWNER,,}/fizz-py-deps"
          tag="${{ hashFiles('scripts/build_fizz_deps.py', '.github/manylinux-deps.Dockerfile') }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push deps image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/manylinux-deps.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    # One job per interpreter, each compiling _core against the prebuilt deps
    # image (minutes, not ~40 min). liboqs travels with fizz's getdeps manifest,
    # giving real post-quantum (X25519MLKEM768) support.
    name: Wheel ${{ matrix.python }}
    needs: deps_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v6

      # cibuildwheel pulls the deps image via docker; authenticate so the GHCR
      # package is reachable.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ needs.deps_image.outputs.image }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
