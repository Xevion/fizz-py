name: Wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
  # Rebuild wheels against the deps image as soon as it finishes rebuilding, so a
  # change to the folly/fizz tree propagates without a manual re-run. Normal code
  # pushes still build against the existing :latest image via the push trigger.
  workflow_run:
    workflows: ["Manylinux deps image"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip when chained off a failed image rebuild.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    # One job per interpreter, each compiling _core against the prebuilt
    # ghcr.io/.../fizz-py-deps image (the heavy folly+fizz+liboqs tree is baked
    # in, so this is minutes, not ~40 min). liboqs travels with fizz's getdeps
    # manifest, giving real post-quantum (X25519MLKEM768) support.
    name: Wheel ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v6

      # cibuildwheel pulls the deps image via docker; authenticate so the GHCR
      # package is reachable.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
