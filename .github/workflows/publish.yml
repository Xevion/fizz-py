name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  # Reuse the wheel/sdist build so a tag produces exactly the artifacts CI
  # already validates on every push.
  build:
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # OIDC token for PyPI Trusted Publishing — no API token/secret required.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
